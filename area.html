<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do cliente · VHG</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/vhg.css?v=3">
</head>
<body data-precisa-supabase>
<div id="vhg-header"></div>

<main class="wrap pagina">
  <div class="carregando" id="carregando">CARREGANDO…</div>

  <div id="conteudo" hidden>
    <div class="cabeca-pagina cabeca-area">
      <div style="min-width:0">
        <div class="eyebrow">ÁREA DO CLIENTE</div>
        <h1 class="h1-pagina" id="ola">Olá.</h1>
        <div class="email" id="email"></div>
      </div>
      <div class="botoes">
        <a href="admin.html" class="btn btn-linha" id="link-admin" hidden>PAINEL DO ADMIN</a>
        <button type="button" class="btn btn-linha" id="sair">SAIR</button>
      </div>
    </div>

    <div class="duas-colunas">
      <div class="principal" style="flex-basis:520px">
        <div class="eyebrow" style="margin-bottom:18px">SEUS FORMULÁRIOS</div>
        <div class="lista-forms" id="forms"></div>
      </div>

      <aside>
        <div class="card-escuro">
          <div class="eyebrow cobre">COMO FUNCIONA</div>
          <div class="passos">
            <div>1 · Preencha a ficha cadastral.</div>
            <div>2 · Assine o contrato do plano.</div>
            <div>3 · Responda o diagnóstico no seu ritmo.</div>
            <div>4 · Analiso e marco nossa reunião.</div>
          </div>
        </div>
        <div class="texto-apoio">
          Dúvida sobre algum campo? <a href="#" data-wa target="_blank" rel="noopener" class="sublinhado">Fale comigo no WhatsApp</a> ou <a href="#" data-email class="sublinhado">por e-mail</a>.
        </div>
      </aside>
    </div>
  </div>
</main>

<div id="vhg-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/vhg.js"></script>
<script src="assets/js/planos.js"></script>
<script src="assets/js/contrato-modelo.js"></script>
<script>
(async function () {
  var esc = VHG.esc;
  if (!VHG.configurado()) { document.getElementById("carregando").textContent = "ÁREA DO CLIENTE INDISPONÍVEL NO MOMENTO."; return; }
  var s = await VHG.exigirLogin();
  if (!s) return;
  var c = VHG.sb();

  var resp = await Promise.all([
    VHG.perfil(s.user.id),
    c.from("diagnosticos").select("status, progresso, relatorio_liberado, enviado_em").eq("user_id", s.user.id).maybeSingle(),
    c.from("fichas").select("status, progresso, respostas").eq("user_id", s.user.id).maybeSingle(),
    c.from("contratos").select("id, assinado_em").eq("user_id", s.user.id).maybeSingle()
  ]);
  var p = resp[0], d = resp[1].data, fi = resp[2].data, ct = resp[3].data;

  document.getElementById("ola").textContent = "Olá, " + (VHG.primeiroNome(p, s.user) || "") + ".";
  document.getElementById("email").textContent = s.user.email;
  if (p && p.papel === "admin") document.getElementById("link-admin").hidden = false;

  var STATUS = {
    nao_iniciado: { label: "NÃO INICIADO", cor: "#6B6358", acao: "COMEÇAR" },
    andamento: { label: "EM ANDAMENTO", cor: "#C08A4E", acao: "CONTINUAR" },
    enviado: { label: "ENVIADO ✓", cor: "#123B47", acao: "VER RESPOSTAS" }
  };

  function estado(linha) {
    var e = linha ? { status: linha.status, progresso: linha.progresso || 0 } : { status: "nao_iniciado", progresso: 0 };
    if (e.status === "enviado") e.progresso = 100;
    return e;
  }
  var ficha = estado(fi), diag = estado(d);
  var contrato = ct ? { status: "assinado", progresso: 100 } : { status: "nao_assinado", progresso: 0 };
  STATUS.nao_assinado = { label: "NÃO ASSINADO", cor: "#6B6358", acao: "LER E ASSINAR" };
  STATUS.assinado = { label: "ASSINADO ✓ · " + (ct ? VHG.dataBR(ct.assinado_em) : ""), cor: "#123B47", acao: "VER CONTRATO" };
  // Ordem do fluxo: ficha → contrato → diagnóstico. Quem já tinha
  // começado o diagnóstico antes dessa regra continua liberado.
  var contratoBloqueado = ficha.status !== "enviado";
  var diagBloqueado = !ct && !d;
  // Ficha enviada e contrato ainda não assinado: o cliente pode reabrir a
  // ficha, e é avisado se faltar algo que o contrato precisa.
  var fichaEditavel = fi && fi.status === "enviado" && !ct;
  var faltaFicha = fichaEditavel ? VHG_CONTRATO.faltandoNaFicha(fi.respostas || {}) : [];
  if (faltaFicha.length) {
    STATUS.ficha_incompleta = { label: "FALTAM DADOS PARA O CONTRATO", cor: "#C08A4E", acao: "VER RESPOSTAS" };
    ficha.status = "ficha_incompleta";
    contratoBloqueado = true;
  }

  var FORMS = [
    { num: "01", titulo: "Ficha cadastral", desc: "Dados pessoais, família, profissão e contatos. Leva cerca de 10 minutos.", href: "ficha.html", estado: ficha, editavel: fichaEditavel, incompleta: faltaFicha.length > 0 },
    { num: "02", titulo: "Contrato", desc: "O contrato do plano escolhido, já preenchido com os dados da ficha. Assinatura eletrônica, aqui mesmo.", href: "contrato.html", estado: contrato, bloqueado: contratoBloqueado, aviso: faltaFicha.length ? "COMPLETE A FICHA" : "DEPOIS DA FICHA" },
    { num: "03", titulo: "Diagnóstico financeiro", desc: "Renda, gastos, patrimônio, dívidas e objetivos, em 10 etapas. Pode pausar e continuar depois.", href: "diagnostico.html", estado: diag, bloqueado: diagBloqueado, aviso: "DEPOIS DO CONTRATO",
      relatorio: d && d.status === "enviado" ? (d.relatorio_liberado ? "liberado" : "analise") : null }
  ];

  document.getElementById("forms").innerHTML = FORMS.map(function (f) {
    var st = STATUS[f.estado.status] || STATUS.nao_iniciado;
    var rotulo = f.estado.status === "andamento" ? st.label + " · " + f.estado.progresso + "%" : st.label;
    var acoes;
    if (f.bloqueado) {
      acoes = '<span class="em-breve">' + f.aviso + "</span>";
    } else {
      acoes = '<div class="acoes">' +
        (f.relatorio === "liberado" ? '<a href="relatorio.html" class="btn btn-cobre">VER RELATÓRIO</a>' : "") +
        (f.incompleta ? '<button type="button" class="btn btn-cobre" data-editar-ficha>COMPLETAR FICHA</button>' : "") +
        '<a href="' + f.href + '" class="btn btn-petroleo">' + st.acao + "</a>" +
        (f.editavel && !f.incompleta ? '<button type="button" class="btn btn-linha" data-editar-ficha>EDITAR FICHA</button>' : "") +
        "</div>";
    }
    if (f.incompleta) rotulo = st.label;
    var notaRelatorio = f.incompleta
      ? '<div style="margin-top:12px; font-size:13px; color:#6B6358">Falta: ' + esc(faltaFicha.join(", ")) + ".</div>"
      : f.relatorio === "analise"
      ? '<div style="margin-top:12px; font-size:13px; color:#6B6358">Relatório em análise. Aviso por e-mail quando estiver pronto.</div>'
      : f.relatorio === "liberado" ? '<div style="margin-top:12px; font-size:13px; color:#123B47">Seu relatório está disponível.</div>' : "";
    return '<div class="card form-card">' +
      '<div class="num">' + f.num + '</div>' +
      '<div class="info"><div class="tit">' + esc(f.titulo) + '</div><p>' + esc(f.desc) + '</p>' +
        '<div class="progresso"><div class="barra"><div style="width:' + f.estado.progresso + '%"></div></div>' +
        '<span class="status" style="color:' + st.cor + '">' + rotulo + '</span></div>' + notaRelatorio + '</div>' +
      acoes + '</div>';
  }).join("");

  document.querySelectorAll("[data-editar-ficha]").forEach(function (b) {
    b.addEventListener("click", async function () {
      var texto = b.textContent;
      b.disabled = true; b.textContent = "ABRINDO…";
      var r = await c.rpc("reabrir_minha_ficha");
      if (r.error) {
        b.disabled = false; b.textContent = texto;
        alert(/could not find the function|schema cache/i.test(r.error.message)
          ? "A edição ainda não está disponível: falta rodar o arquivo supabase/6-contratos.sql no Supabase."
          : r.error.message);
        return;
      }
      location.href = "ficha.html";
    });
  });

  document.getElementById("sair").addEventListener("click", async function () {
    await c.auth.signOut();
    location.replace("entrar.html");
  });

  document.getElementById("carregando").hidden = true;
  document.getElementById("conteudo").hidden = false;
})();
</script>
</body>
</html>
